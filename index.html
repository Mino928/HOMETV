<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOME TV</title>
  <link href="https://zencdn.net" rel="stylesheet" />
  <script src="https://zencdn.net"></script>
  <style>
    body { background-color: #111; color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; text-align: center; }
    h1 { margin-bottom: 30px; color: #aaa; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; padding-bottom: 50px; }
    .channel-box { background-color: #222; border: 2px solid #444; border-radius: 10px; padding: 15px; cursor: pointer; transition: all 0.2s; }
    .channel-box:focus { outline: 5px solid #00E676 !important; background-color: #2e7d32 !important; transform: scale(1.08); }
    .channel-box img { width: 100px; height: 100px; object-fit: contain; pointer-events: none; }
    .channel-box div { margin-top: 10px; font-size: 16px; font-weight: bold; pointer-events: none; }
    #video-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 9999; }
    .video-js { width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
  <h1>TV Bookmarks</h1>
  <div id="video-overlay"><video id="my-tv-player" class="video-js vjs-default-skin" controls preload="auto"></video></div>
  <div class="grid-container">
    <!-- Channel list continues down to Q TV -->

    <div class="channel-box" tabindex="0" data-stream="https://cloudfront.net"><img src="https://streamready.in"><div>Sanskar TV</div></div>
    <div class="channel-box" tabindex="0" data-stream="https://amagi.tv"><img src="https://jio.com"><div>Swastik Stories</div></div>
    <div class="channel-box" tabindex="0" data-stream="https://githubusercontent.com"><img src="https://streamready.in"><div>Zee Cinema</div></div>
  </div>
  <script>
    var player = videojs('my-tv-player');
    var overlay = document.getElementById('video-overlay');
    var currentBox = null;
    document.querySelectorAll('.channel-box').forEach(function(box) {
      box.addEventListener('click', function() {
        currentBox = box;
        var streamUrl = box.getAttribute('data-stream');
        overlay.style.display = 'block';
        player.src({ src: streamUrl, type: 'application/x-mpegURL' });
        player.muted(false); 
        player.play();
        var playerEl = document.getElementById('video-overlay');
        if (playerEl.requestFullscreen) playerEl.requestFullscreen();
        else if (playerEl.webkitRequestFullscreen) playerEl.webkitRequestFullscreen();
      });
    });
    document.addEventListener('keydown', function(e) {
      if ((e.key === 'Enter' || e.keyCode === 23) && document.activeElement.classList.contains('channel-box')) {
        document.activeElement.click();
      }
      if (e.key === 'Backspace' || e.keyCode === 4) { 
        if (overlay.style.display === 'block') {
          e.preventDefault();
          player.pause();
          overlay.style.display = 'none';
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          if (currentBox) currentBox.focus();
        }
      }
    });
    window.onload = function() {
      var firstBox = document.querySelector('.channel-box');
      if (firstBox) firstBox.focus();
    };
  </script>
</body>
</html>
